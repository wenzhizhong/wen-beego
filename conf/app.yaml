appname: WenBeego
httpport: 8013
runmode: dev
version: 1.0.0
EnableDocs: false
copyrequestbody: true
timezone: Asia/Shanghai
apiSecurity:
  encrypt: true
  encryptAlg: RS512
  signature: true
  signAlg: HS256
gorm:
  # logLevel Silent Error Warn Info 
  logLevel: Info
pgsql:
  host: localhost
  user: postgres
  password: postgres
  dbname: postgres
  port: 5432
  sslmode: disable
  timezone: Asia/Shanghai
pgsql_read:
  read_1:
    host: localhost
    user: postgres
    password: postgres
    dbname: postgres
    port: 5432
    sslmode: disable
    timezone: Asia/Shanghai

redis:
  host: localhost
  port: 6379
  username: ""
  password: ""
  maxIdle: "10"
  timeout: 0
  dbNum: 0
  key: ""
  skipEmptyPrefix: ""
  remark: "key:前缀，"

log:
  level: debug
  path: ../../temp/logs
  pathMq: ../../temp/logs-mq
  pathTerminal: ../../temp/logs-terminal
  pathUnitTest: ../../temp/logs-unit-test
  maxlines: ""
  maxsize: ""
  daily: true
  maxdays: 15
  rotate: true
  separate: emergency,alert,critical,error,warning,notice,info,debug
logToDbModules:
  - "admin_plat"
  - "admin_mchnt"
  - "api"
branca:
  common:
    iss: wenBeego
    aud: wenBeegoAdminPlatUi
    key: rxZIWltzyV39uRjwN071UvPa6EcpJFeK
    exp: 7200
    expRemark: 2*60*60
  admin_plat:
    iss: wenBeegoAdminPlat
    aud: wenBeegoAdminPlatUi
    key: rxN07JpyV3ZIWltza6EcUvP9uRjw1eKF
    exp: 86400
    expRemark: 24*60*60
  admin_mchnt:
    iss: wenBeegoAdminMchnt
    aud: wenBeegoAdminMchntUi
    key: Uz4IhHSkEuWMmN98gL6YPBZJqDtvf12K
    exp: 86400
    expRemark: 24*60*60
  api:
    iss: wenBeegoApi
    aud: wenBeegoApiUi
    key: USqKW6Ntvf12g9BZJLHDkEuhI8YPz4Mm
    exp: 86400
    expRemark: 24*60*60
queue:
  type: rabbitmq
  default_queue: wen_beego_tasks
  redis:
    host: localhost
    dbNum: 0
    port: 6379
    password: ""
  rabbitmq:
    host: localhost
    port: 5672
    user: guest
    password: guest
    exchange:     machinery_exchange
    exchangeDlx:  machinery_exchange_dlx
    exchangeType: direct
    # bindingKey:   machinery_task
upload:
  types: 
    - local 
    - minio
    - aliyun
  type: local
  local:
    public:
      path: /uploads/public
      url: http://localhost:8013/public
      maxSize: 10
    private:
      path: /uploads/private
      url: http://localhost:8013/private
      maxSize: 10
  minio:
    public:
    private:
  aliyun:
    public:
    private:
    
